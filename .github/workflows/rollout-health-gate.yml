name: rollout-health-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install quality tooling
        run: python -m pip install ruff==0.16.9
      - name: Lint
        run: ruff check --isolated tools/container_app_rollout_gate.py tests/test_container_app_rollout_gate.py
      - name: Format
        run: ruff format --isolated --check tools/container_app_rollout_gate.py tests/test_container_app_rollout_gate.py
      - name: Test
        run: python -m unittest tests.test_container_app_rollout_gate -v
      - name: Compile
        run: python -m compileall -q tools tests
      - name: CLI contract
        run: python tools/container_app_rollout_gate.py --help >/dev/null
