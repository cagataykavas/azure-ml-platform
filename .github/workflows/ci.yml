name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python quality tools
        run: python -m pip install ruff==0.16.9
      - name: Install Bicep CLI
        run: az bicep install
      - name: Build Bicep template
        run: az bicep build --file infra/main.bicep --stdout > /tmp/main.json
      - name: Verify generated ARM template
        run: test -s /tmp/main.json
      - name: Audit private storage network contract
        run: python scripts/audit_private_storage.py /tmp/main.json
      - name: Test contract auditor
        run: python -m unittest discover -s tests -v
      - name: Compile Python validation code
        run: python -m compileall -q scripts tests
      - name: Lint and format-check Python validation code
        run: |
          ruff check scripts tests
          ruff format --check scripts tests
